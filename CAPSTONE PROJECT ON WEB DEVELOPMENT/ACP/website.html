<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>🍕 Fun Kids Pizza Party! 🍕</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', Arial, sans-serif;
            background-color: #b6f8ef;
            color: #444;
        }
        .topnav {
            background-color: #ff5722;
            padding: 10px;
            text-align: center;
            border-bottom: 5px dashed #ffeb3b;
        }
        .topnav a {
            display: inline-block;
            color: #ffffff;
            font-weight: bold;
            padding: 10px 18px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .topnav a:hover, .topnav a.active {
            background-color: #ffeb3b;
            color: #d32f2f;
        }
        .section {
            text-align: center;
            padding: 40px 20px;
        }
        .section-light { background-color: #ffffff; }
        .section-dark { background-color: #282e34; color: #ddd; }
        .slideshow-container {
            max-width: 900px;
            position: relative;
            margin: auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 6px solid #ffeb3b;
        }
        .mySlides { width: 100%; height: 400px; object-fit: cover; display: none; }
        fieldset {
            max-width: 450px;
            margin: 30px auto;
            background: #fff9c4;
            border: 4px dashed #ff5722;
            border-radius: 15px;
            padding: 20px;
            text-align: left;
        }
        legend { font-weight: bold; color: #d32f2f; font-size: 22px; padding: 0 10px; }
        label { font-weight: bold; color: #333; font-size: 14px; }
        input[type="text"], textarea {
            width: 93%;
            padding: 10px;
            margin: 6px 0 14px 0;
            border: 2px solid #80deea;
            border-radius: 8px;
            font-size: 14px;
        }
        input[type="submit"] {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover { background-color: #e64a19; }
        h1, h2 { text-align: center; color: #d32f2f; text-shadow: 1px 1px #ffeb3b; }
    </style>
</head>
<body>

    <!-- Cute Top Navigation Bar -->
    <div class="topnav">
        <a class="active" href="#home">🏠 Home</a>
        <a href="#about">🍕 About Us</a>
        <a href="#gallery">📸 Gallery</a>
        <a href="#contact">💌 Contact Us</a>
    </div>

    <!-- Welcome Header -->
    <div class="section section-light">
        <h1>🌟 Welcome to the Magic Pizza Clubhouse! 🌟</h1>
        <p style="font-size: 18px; color: #00796b;">Where every slice comes with a huge smile and extra cheese!</p>
    </div>

    <!-- Image Slideshow (Using Pexels Pizza Images) -->
    <div class="slideshow-container">
        <img class="mySlides" src="https://images.pexels.com/photos/315755/pexels-photo-315755.jpeg" alt="Yummy Pizza 1">
        <img class="mySlides" src="https://images.pexels.com/photos/2147491/pexels-photo-2147491.jpeg" alt="Yummy Pizza 2">
        <img class="mySlides" src="https://images.pexels.com/photos/1146760/pexels-photo-1146760.jpeg" alt="Yummy Pizza 3">
    </div>

    <!-- Contact Section -->
    <div id="contact" class="section">
        <h2>📬 Send a Note to Dr. Coder!</h2>
        <form onsubmit="event.preventDefault(); alert('Yay! Your message was sent to the pizza chef! 🍕');">
            <fieldset>
                <legend> Say Hello! 💌 </legend>
                <label>Your Cool Name:</label><br>
                <input type="text" name="name" placeholder="e.g., Pizza Superhero" required><br>
                <label>How old are you?:</label><br>
                <input type="text" name="age" placeholder="e.g., 10"><br>
                <label>Your Email Address:</label><br>
                <input type="text" name="email" placeholder="coder@gmail.com" required><br>
                <label>Your Fun Message:</label><br>
                <textarea rows="3" placeholder="I love extra cheese!"></textarea><br>
                <input type="submit" value="🚀 Send Message">
            </fieldset>
        </form>
    </div>

    <!-- Footer -->
    <div class="section section-dark">
        <p>✨ Contact us directly at: <strong>coder@gmail.com</strong> ✨</p>
        <p style="font-size: 12px; color: #aaa;">All copyrights reserved &copy; 2026 Pizza Kids Club</p>
    </div>

    <!-- Automatic Slideshow JavaScript -->
    <script>
        var myIndex = 0;
        carousel();
        function carousel() {
            var x = document.getElementsByClassName("mySlides");
            for (var i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
            myIndex++;
            if (myIndex > x.length) { myIndex = 1; }
            x[myIndex - 1].style.display = "block";
            setTimeout(carousel, 3000); // Changes image every 3 seconds
        }
    </script>
</body>
</html>
