<!DOCTYPE html>
<html>
  <body>
    <!-- Slide Show -->
     <center>
    <section>
      <img class="mySlides" src="https://images.pexels.com/photos/34924711/pexels-photo-34924711.jpeg" style="height:500px;">
      <img class="mySlides" src="https://images.pexels.com/photos/19867354/pexels-photo-19867354.jpeg" style="height:500px;">
    </section>
    </center>
    <script>
      // Automatic Slideshow - change image every 3 seconds
      var myIndex = 0;
      carousel();

      function carousel() {
        var i;
        var x = document.getElementsByClassName("mySlides");
        for (i = 0; i < x.length; i++) {
          x[i].style.display = "none";
        }
        myIndex++;
        if (myIndex > x.length) {myIndex = 1}
        x[myIndex-1].style.display = "block";
        setTimeout(carousel, 3000);
      }
    </script>
  </body>
</html>
