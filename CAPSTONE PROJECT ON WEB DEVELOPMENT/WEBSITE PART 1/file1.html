<!DOCTYPE html>
<html>
  <head>
    <title>Navbar</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      .topnav {
        overflow: hidden;
        background-color: #333;
      }
      .topnav a {
        float: left;
        color: #139e93;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }
      .topnav a:hover {
        background-color: #ddd;
        color: black;
      }
      .topnav a.active {
        background-color: #ffe066;
        color: black;
      }
      .pimg3 {
  background-image:url('https://images.pexels.com/photos/34924711/pexels-photo-34924711.jpeg');
  min-height:100%;
}
    </style>
  </head>
  <body>
    <div class="topnav">
      <a class="active" href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Gallery</a>
    </div><br>
    <span class="border trans" style="font-size:40px;">
      <center>Welcome all to this website</center>
    </span><br>

    <section>
      <h2> Japanese cuisine</h2>
<p>Japanese cuisine, known traditionally as washoku, focuses on fresh, seasonal ingredients, delicate flavors, and artistic presentation.</p>
    </section>

    <div class="pimg3">
      <div class="ptext">
        <span class="border trans">Image Two Text</span>
      </div>
    </div>

    <section class="section section-dark">
      <span>All @copy rights reserved by Coder19</span>
    </section>
  </body>
</html>
